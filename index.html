<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODICS</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="icon" type="image/png" href="./assets/foodfavicon2.jpg">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./miniproject.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <i class="fa-solid fa-bars icon" id="menu-icon"></i>

            <h4 class="Heading">
                <span>F</span>OOD<span>ICS</span>
            </h4>

            <ul class="menus" id="menus">
                <li>Shop</li>
                <li>Features</li>
                <li>Recipes</li>
                <li>Hotline</li>
            </ul>

            <div class="profile-section">

                <i class="fa-solid fa-cart-shopping shop-icon"></i>

                <div class="profile-div">
                    <img class="profile-img"
                        src="./assets/foodfavicon2.jpg"
                        alt="profile">
                </div>

            </div>

        </nav>

    </header>

    <main>

        <section class="hero-section">

            <div class="left-section">

                <h1>
                    <span>Herb-Infused</span> Chicken
                    <br>
                    Delight
                </h1>

                <p>
                    Herb-Infused Chicken Delight features
                    tender grilled chicken drumsticks seasoned
                    with fresh rosemary, served atop a vibrant
                    mix of cherry tomatoes, cucumber slices,
                    and greens for a flavorful and healthy
                    meal.
                </p>

                <div class="button-section">

                    <button class="order-btn">
                        Order Now
                    </button>

                    <button class="dine-btn">
                        Dine-In
                    </button>

                </div>

                <div class="food-list">

                    <img src="./assets/image1.jpeg" alt="food">

                    <img src="./assets/image2.jpeg" alt="food">

                    <img src="./assets/image3.jpeg" alt="food">

                </div>

            </div>

            <div class="right-section">

                <img class="background-food"
                    src="./assets/background.png"
                    alt="food background">

                <img class="main-food"
                    src="./assets/main image.png"
                    alt="Herb Infused Chicken">

            </div>

        </section>

    </main>

   

</body>

</html>
